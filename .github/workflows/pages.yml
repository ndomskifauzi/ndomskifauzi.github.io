name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node build.mjs
      - run: node verify.mjs
      - name: Add Search Console ownership proof
        if: ${{ vars.GSC_VERIFICATION_FILENAME != '' }}
        env:
          GSC_VERIFICATION_FILENAME: ${{ vars.GSC_VERIFICATION_FILENAME }}
        shell: bash
        run: |
          [[ "$GSC_VERIFICATION_FILENAME" =~ ^google[0-9a-f]+\.html$ ]]
          printf 'google-site-verification: %s' "$GSC_VERIFICATION_FILENAME" > "dist/$GSC_VERIFICATION_FILENAME"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
